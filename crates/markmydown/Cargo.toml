[package]
name = "markmydown"
description = "A fast, native, offline-first Markdown workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "markmydown"
path = "src/main.rs"

[dependencies]
iced.workspace = true
iced-code-editor.workspace = true
comrak.workspace = true
syntect.workspace = true
iced_math.workspace = true
merman.workspace = true
pdfrs.workspace = true
rfd.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
trash.workspace = true
ignore.workspace = true
encoding_rs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
directories.workspace = true
minijinja.workspace = true
self_update.workspace = true
sha2.workspace = true
regex.workspace = true
base64.workspace = true
html2md.workspace = true
ammonia.workspace = true
log.workspace = true
env_logger.workspace = true
open.workspace = true
arboard.workspace = true
thiserror.workspace = true
resvg.workspace = true
tiny-skia.workspace = true
png.workspace = true
tempfile.workspace = true

[dev-dependencies]
insta.workspace = true
iced-code-editor = { workspace = true, features = ["bench"] }

[package.metadata.packager]
product-name = "markmydown"
identifier = "dev.markmydown.markmydown"
description = "A fast, native, offline-first Markdown workbench"
long-description = "A pure-Rust Markdown workbench with a local-folder workspace, native preview, and Markdown, HTML, and PDF export."
homepage = "https://github.com/iTzFaisal/markmydown"
authors = ["markmydown contributors"]
category = "Productivity"
before-packaging-command = "cargo build -p markmydown --release"
out-dir = "../../target/packager"
icons = [
  "../../assets/icons/icon-16.png",
  "../../assets/icons/icon-32.png",
  "../../assets/icons/icon-128.png",
  "../../assets/icons/icon-256.png",
  "../../assets/icons/icon-512.png",
  "../../assets/icons/icon-512@2x.png",
]

[[package.metadata.packager.file-associations]]
extensions = ["md", "markdown", "mdown"]
name = "Markdown Document"
description = "Markdown document"
mime-type = "text/markdown"
role = "editor"

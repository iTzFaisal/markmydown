[workspace]
members = ["crates/markmydown", "vendor/iced-code-editor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["markmydown contributors"]
repository = "https://github.com/iTzFaisal/markmydown"

[workspace.dependencies]
iced = { version = "=0.14.0", features = ["advanced", "canvas", "highlighter", "image", "markdown", "smol", "svg"] }
iced-code-editor = { path = "vendor/iced-code-editor" }
comrak = { version = "=0.59.0", default-features = false, features = ["shortcodes"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
iced_math = "=0.5.0"
merman = "=0.9.2"
pdfrs = { version = "=0.2.0", default-features = false, features = ["parallel"] }
rfd = "=0.17.2"
notify = "=8.2.1"
notify-debouncer-mini = "=0.7.0"
trash = "=5.2.9"
ignore = "=0.4.34"
encoding_rs = "=0.8.42"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
directories = "=6.0.0"
minijinja = "=3.0.4"
self_update = { version = "=1.3.3", default-features = false, features = ["reqwest", "rustls", "progress-bar", "github", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "checksums"] }
sha2 = "=0.11.1"
regex = "=1.13.1"
base64 = "=0.23.1"
html2md = "=0.2.17"
ammonia = "=4.2.4"
log = "=0.4.34"
env_logger = "=0.11.11"
open = "=5.4.5"
arboard = "=3.7.0"
thiserror = "=2.0.21"
png = "=0.17.16"
resvg = "=0.45.1"
tiny-skia = { version = "=0.11.4", features = ["png-format"] }
tempfile = "=3.27.0"
insta = "=1.49.0"
